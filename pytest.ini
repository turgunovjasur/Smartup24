[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
# Chiqindi/artefakt va virtual-muhit papkalariga kirmaymiz — test-results ichidagi
# `test_*.txt` log fayllari `testpaths=.` bilan collection'ni buzardi (UnicodeDecodeError).
norecursedirs = test-results .git .venv venv node_modules .playwright-mcp __pycache__ Python_dars chess-analysis
addopts = --alluredir=test-results/allure-results --clean-alluredir
