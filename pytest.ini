[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
# Chiqindi/artefakt va virtual-muhit papkalariga kirmaymiz — test-results ichidagi
# `test_*.txt` log fayllari `testpaths=.` bilan collection'ni buzardi (UnicodeDecodeError).
# tests_mobile — Appium (Android) testlari, ALOHIDA stack; web `pytest` uni yig'MAYDI.
# Ishga tushirish: python -m pytest tests_mobile/tests -v (Appium server + telefon shart).
norecursedirs = test-results .git .venv venv node_modules .playwright-mcp __pycache__ Python_dars chess-analysis tests_mobile
addopts = --alluredir=test-results/allure-results --clean-alluredir
markers =
    mobile: Android/Appium mobil testlari (web bilan aralashmaydi)
