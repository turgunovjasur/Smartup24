name: "Hourly test run"

# NEGA CONCURRENCY GUARD
# ----------------------
# Bu suite JONLI ERP'ga va ULASHILGAN akkauntga tegadi (e2e.yml bilan bir xil).
# Ikki run bir akkauntda parallel yursa ikkalasi ham yiqiladi — shuning uchun
# e2e.yml bilan BIR concurrency guruhida (overlapping run YO'Q). CI headless
# ishlaydi (HEADLESS=1) — conftest shu env var'ni o'qiydi.

on:
  workflow_dispatch: {}        # qo'lda ishga tushirish
  schedule:
    - cron: "0 */2 * * *"      # har 2 soatda (UTC)

concurrency:
  group: e2e-shared-account    # ulashilgan akkaunt — overlapping run YO'Q
  cancel-in-progress: false    # boshlangan run tugasin, yangisi kutsin

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run currency regression
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          HEADLESS: "1"
        run: python -m pytest tests/test_setup/test_currency.py -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
