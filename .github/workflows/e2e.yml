name: E2E (Playwright)

# NIMA ISHLAYDI
# ------------
# Faqat to'liq suite `tests/test_all_runner.py` (boshqa test YO'Q). Har 2 soatda
# (UTC) + qo'lda ishga tushiriladi. Suite JONLI tashqi ERP'ga va ULASHILGAN
# akkauntga tegadi — bir akkauntda ikki run parallel yursa ikkalasi ham yiqiladi,
# shuning uchun concurrency guard bir vaqtda faqat BITTA run'ga ruxsat beradi.
# CI headless ishlaydi (HEADLESS=1). Natija Telegramga yuboriladi
# (conftest.pytest_sessionfinish → TG_BOT_TOKEN/TG_CHAT_ID env'lardan).

on:
  workflow_dispatch: {}        # qo'lda ishga tushirish
  schedule:
    - cron: "0 */2 * * *"      # har 2 soatda (UTC)

concurrency:
  group: e2e-shared-account    # ulashilgan akkaunt — overlapping run YO'Q
  cancel-in-progress: false    # boshlangan run tugasin, yangisi kutsin

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HEADLESS: "1"                              # conftest brauzerni ko'rsatmaydi
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}  # Telegram bildirishnoma uchun
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run full suite (test_all_runner)
        run: python -m pytest tests/test_all_runner.py -v

      # Test yaratgan ma'lumotni bazadan tozalash (baza o'smasin) — best-effort,
      # test natijasidan qat'i nazar bajariladi.
      - name: Cleanup test data
        if: always()
        run: python scripts/cleanup_test_data.py --headless || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: test-results/allure-results
          if-no-files-found: ignore
