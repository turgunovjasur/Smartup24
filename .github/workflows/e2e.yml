name: E2E (Playwright)

# NIMA ISHLAYDI
# ------------
# Suite ikki jadval bo'yicha, TURLI bo'limlar bilan ishlaydi:
#   * Har 2 soatda   → setup + group_a               (tez/kritik: basic create + zakaz)
#   * Har 12 soatda  → regression + main + document  (og'ir to'liq CRUD; Toshkent 08:12 / 20:12)
# GitHub cron UTC bo'yicha: "12 3,15 * * *" = Toshkent (UTC+5) 08:12 va 20:12.
# 12 soatlik run uch bo'limni BITTA pytest chaqiruvida (bitta login zanjiri, bitta
# Telegram progress xabari) ketma-ket ishlatadi — ulashilgan akkaunt uchun xavfsiz.
#
# Har scheduled hodisa BUTUN workflow'ni ishga tushiradi — kerakli job'ni
# `github.event.schedule` bo'yicha `if:` ajratadi, shuning uchun bir vaqtda
# FAQAT bitta job yuradi (2 soatlik va 12 soatlik cron'lar soatlari kesishmaydi:
# */2 juft soatlarda, 3/15 toq soatlarda). Qo'lda (workflow_dispatch) `target`
# input bilan bitta bo'lim tanlanadi.
#
# Suite JONLI tashqi ERP'ga va ULASHILGAN akkauntga tegadi — bir akkauntda ikki
# run parallel yursa ikkalasi ham yiqiladi. concurrency guard butun workflow
# uchun bir vaqtda BITTA run'ga ruxsat beradi (yangisi kutadi). Job'lar ham
# hech qachon parallel ishlamaydi (yuqoridagi if: ajratish + har run'da bitta
# job). CI headless (HEADLESS=1); natija Telegramga yuboriladi
# (conftest → TG_BOT_TOKEN/TG_CHAT_ID). Muhit har doim DEV (TEST_ENV berilmaydi)
# — PROD faqat Telegram bot orqali qo'lda.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Qaysi bo'lim ishga tushsin"
        type: choice
        options:
          - setup_groupa            # setup + group_a
          - regression              # regression + main + document
        default: setup_groupa
  # DIQQAT: daqiqa ATAY :12 (":00" EMAS) — GitHub scheduled run'lar har soatning
  # :00 daqiqasida eng yuqori yuklamaga tushib KECHIKADI yoki TASHLAB YUBORILADI
  # (GitHub hujjati). :12 ga siljitish drop'larni kamaytiradi. Soatlar o'zgarmaydi.
  schedule:
    - cron: "12 */2 * * *"    # har 2 soatda → setup + group_a
    - cron: "12 3,15 * * *"   # har 12 soatda → regression + main + document (Toshkent 08:12 / 20:12)

concurrency:
  group: e2e-shared-account    # ulashilgan akkaunt — overlapping run YO'Q
  cancel-in-progress: false    # boshlangan run tugasin, yangisi kutsin

jobs:
  # ── Har 2 soatda: setup + group_a (bitta login, bitta seans) ─────────────────
  setup_groupa:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '12 */2 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'setup_groupa')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HEADLESS: "1"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run setup + group_a
        run: >-
          python -m pytest
          tests/test_setup/test_all_setup.py
          tests/test_group_a/test_all_group_a.py
          -v
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-setup-groupa
          path: test-results/allure-results
          if-no-files-found: ignore

  # ── Har 12 soatda: regression + main + document (to'liq CRUD, bitta seans) ────
  regression:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '12 3,15 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'regression')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HEADLESS: "1"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run regression + main + document
        run: >-
          python -m pytest
          tests/test_regression/test_all_regression.py
          tests/test_main/test_all_main.py
          tests/test_document/test_all_document_runner.py
          -v
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: test-results/allure-results
          if-no-files-found: ignore
